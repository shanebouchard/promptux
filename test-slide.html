<!DOCTYPE html>
<html lang="en" data-theme="editorial">
<head>
<meta charset="UTF-8">
<style>
:root[data-theme="editorial"] {
    --ink: oklch(0.21 0.014 165);
    --paper: oklch(0.93 0.014 78);
    --mid: oklch(0.49 0.012 165);
    --display: 'EB Garamond', Georgia, serif;
    --body: -apple-system, Arial, sans-serif;
}
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); }
.ed-slide {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    align-items: center;
    gap: 80px;
    padding: 80px 60px 140px;
    min-height: 660px;
    background: var(--paper);
    border: 3px solid magenta;
}
.ed-slide__copy { max-width: 620px; border: 2px solid blue; padding: 8px; }
.ed-slide__copy h2 { font-family: var(--display); font-size: 80px; line-height: 1; margin: 0; }
.ed-slide__copy p { font-size: 18px; color: var(--mid); }
.ed-slide__device { border: 2px solid green; padding: 8px; }
.ed-slide__device img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<article class="ed-slide" data-wash="warm">
    <div class="ed-slide__copy">
        <span>I. Healthcare · MedTech</span>
        <h2><i>Auditory training,</i><br>made daily.</h2>
        <p>Brand and product systems for a clinically validated platform.</p>
        <button>Read the case study →</button>
    </div>
    <figure class="ed-slide__device">
        <img src="assets/themes/phone-1-acme.png" alt="phone">
    </figure>
</article>
</body>
</html>
